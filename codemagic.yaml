workflows:
  android-release:
    name: Usta Kapinda Android Release
    max_build_duration: 120
    environment:
      flutter: stable
      android_signing:
        - usta_kapinda_android_release

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate app icon
        script: |
          dart run flutter_launcher_icons

      - name: Build Android App Bundle
        script: |
          flutter build appbundle --release

    artifacts:
      - build/app/outputs/bundle/release/*.aab

  ios-release:
    name: Usta Kapinda iOS Release
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: Codemagic Usta Kapinda

    environment:
      flutter: stable
      xcode: latest
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.ustakapinda.app
      vars:
        # Codemagic starts in the repository root; the iOS workspace is below ios/.
        XCODE_WORKSPACE: "ios/Runner.xcworkspace"
        XCODE_SCHEME: "Runner"

    scripts:
      - name: Get Flutter packages
        script: |
          flutter pub get

      - name: Generate iOS app icon
        script: |
          dart run flutter_launcher_icons

      - name: Set up iOS code signing
        script: |
          xcode-project use-profiles --project ios/Runner.xcodeproj --custom-export-options='{"testFlightInternalTestingOnly": true}'

      - name: Build iOS IPA
        script: |
          flutter build ipa --release --export-options-plist=/Users/builder/export_options.plist

    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log

    publishing:
      app_store_connect:
        # Uses the App Store Connect key already named above.
        auth: integration
        # Upload for internal TestFlight testing only. Beta and App Store review
        # are intentionally not submitted by this workflow.
